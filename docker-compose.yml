# Leiden Risk User Identification - Docker Compose
#
# Quick start:
#   1. Put your data files in ./data/ (see README for expected files)
#   2. docker compose up
#   3. Open http://localhost:8766 in browser
#
# To retrain models in Jupyter:
#   docker compose --profile dev up jupyter
#   Open http://localhost:8888
#
# MySQL (明细数据存储，建模用):
#   docker compose up -d
#   host=127.0.0.1 port=3306 user=root db=leiden
#   密码不写在文件里：首次启动前在项目根目录建 .env 文件写入
#     MYSQL_ROOT_PASSWORD=<你的密码>
#   已初始化过的容器改密码用：docker compose exec mysql mysql -uroot -p -e "ALTER USER 'root'@'%' IDENTIFIED BY '<新密码>'; FLUSH PRIVILEGES;"
#   数据持久化在 ./data/mysql（不进 git）

services:
  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=leiden
      # 中文数据必须 utf8mb4
      - MYSQL_CHARSET=utf8mb4
      - MYSQL_COLLATION=utf8mb4_unicode_ci
    volumes:
      - ./data/mysql:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build: .
    ports:
      - "8766:8766"
    volumes:
      - ./data:/app/data
      # 开发调试：tools 目录实时同步，改 server/前端代码后只需 docker compose restart
      - ./tools:/app/tools
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  jupyter:
    build: .
    profiles: ["dev"]
    ports:
      - "8888:8888"
    volumes:
      - ./data:/app/data
      - ./notebooks:/app/notebooks
    environment:
      - LEIDEN_BASE=/app
    command: >
      jupyter notebook
      --ip=0.0.0.0
      --port=8888
      --no-browser
      --allow-root
      --notebook-dir=/app/notebooks
      --NotebookApp.password='argon2:$$argon2id$$v=19$$m=10240,t=10,p=8$$e5/lF2WBl4UNbjrFPlN1hA$$FBFL82queHFiZiraFCzQVLxRqQ4eARyZ5q7Z+gzH6jQ'
